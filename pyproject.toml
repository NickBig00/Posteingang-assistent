[project]
name = "posteingang-assistent"
version = "0.1.0"
description = "Demo: KI-gestützter Posteingangs-Assistent mit menschlicher Freigabe"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.14.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openai>=3.31.0",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.22",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# S105/S106: tests use obviously fictitious credentials for fake servers.
"tests/**" = ["S101", "S105", "S106"]
