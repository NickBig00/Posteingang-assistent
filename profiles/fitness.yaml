# Branchenprofil "Fitnessstudio" (SPEC Abschnitt 4). Nur Konfiguration, kein Code.
# Keine Felder mit Gesundheitsbezug – der Loader lehnt solche Felder ab.
key: fitness
name: Fitnessstudio
version: 1
# Unterhalb dieser Konfidenz geht ein Eingang in die manuelle Prüfung.
confidence_threshold: 0.7
fallback_type: sonstiges

document_types:
  - key: kuendigung
    label: Kündigung
    description: >-
      Ein Mitglied erklärt, seine Mitgliedschaft bzw. seinen Vertrag beenden zu wollen –
      auch ohne das Wort „kündigen“ (z. B. „Vertrag beenden“, „nicht mehr abbuchen“).
    keywords: [kündige, kündigen, kündigung, beenden, vertragsende]
    fields:
      - {name: name, type: string, required: true, description: Vollständiger Name des Mitglieds}
      - name: mitgliedsnummer
        type: string
        required: true
        pattern: "M-\\d{5}"
        description: Mitgliedsnummer im Format M-12345
      - {name: eingangsdatum, type: date, required: true, description: "Datum der E-Mail bzw. des Schreibens"}
      - {name: gewuenschtes_kuendigungsdatum, type: date, description: "Ausdrücklich genanntes Datum, zu dem gekündigt wird; leer bei 'nächstmöglicher Zeitpunkt'"}
    rules:
      - {rule: required_fields}
      - {rule: notice_period}
    actions:
      - key: rueckfrage_mitgliedsnummer
        label: Rückfrage zur Mitgliedsnummer
        when_missing: [mitgliedsnummer]
        reply_template: |-
          Guten Tag{% if name %} {{ name }}{% endif %},

          vielen Dank für Ihre Nachricht. Damit wir Ihre Kündigung bearbeiten können, nennen Sie
          uns bitte Ihre Mitgliedsnummer.

          Mit freundlichen Grüßen
          Ihr FitDemo-Team
      - key: vertragsdaten_pruefen
        label: Vertragsdaten manuell prüfen
        when_missing: [vertragsende]
      - key: kuendigung_zum_naechsten_termin
        label: Kündigung zum nächstmöglichen Termin bestätigen
        when_rule: {notice_period: [error]}
        reply_template: |-
          Guten Tag{% if name %} {{ name }}{% endif %},

          vielen Dank für Ihre Nachricht. Eine Kündigung Ihrer Mitgliedschaft {{ mitgliedsnummer }}
          zum {{ gewuenschtes_kuendigungsdatum }} ist laut Vertrag leider nicht mehr fristgerecht
          möglich. Wir haben Ihre Kündigung daher zum nächstmöglichen Termin vorgemerkt: Ihr Vertrag
          endet zum {{ vertragsende }}.

          Mit freundlichen Grüßen
          Ihr FitDemo-Team
      - key: kuendigung_bestaetigen
        label: Kündigung bestätigen
        reply_template: |-
          Guten Tag{% if name %} {{ name }}{% endif %},

          vielen Dank für Ihre Nachricht. Wir bestätigen die Kündigung Ihrer Mitgliedschaft
          {{ mitgliedsnummer }}. Ihr Vertrag endet zum {{ vertragsende }}.

          Mit freundlichen Grüßen
          Ihr FitDemo-Team

  - key: probetraining_anfrage
    label: Anfrage Probetraining
    description: Eine Person möchte ein Probetraining vereinbaren oder fragt danach.
    keywords: [probetraining, reinschnuppern, ausprobieren, probe]
    fields:
      - {name: name, type: string, required: true, description: Name der anfragenden Person}
      - {name: kontakt, type: string, required: true, description: "E-Mail-Adresse oder Telefonnummer für die Rückmeldung"}
      - {name: wunschtermin, type: date, description: "Ausdrücklich genanntes Datum des Wunschtermins"}
      - {name: interesse, type: string, description: "Trainingsinteresse, z. B. Krafttraining, Kurse, Yoga"}
    rules:
      - {rule: required_fields}
    actions:
      - key: kontakt_ermitteln
        label: Kontaktangabe fehlt – manuell ermitteln
        when_missing: [kontakt]
      - key: termin_vorschlagen
        label: Termin vorschlagen
        reply_template: |-
          Guten Tag{% if name %} {{ name }}{% endif %},

          vielen Dank für Ihr Interesse an einem Probetraining. {% if wunschtermin %}Gerne
          reservieren wir Ihnen einen Termin am {{ wunschtermin }}.{% else %}Bitte nennen Sie uns
          einen Wunschtermin, dann reservieren wir Ihnen gerne einen Platz.{% endif %}

          Sportliche Grüße
          Ihr FitDemo-Team

  - key: vertragspause
    label: Vertragspause
    description: Ein Mitglied möchte seine Mitgliedschaft für einen Zeitraum ruhen lassen.
    keywords: [pause, pausieren, ruhen, ruhezeit, aussetzen]
    fields:
      - {name: name, type: string, required: true, description: Vollständiger Name des Mitglieds}
      - name: mitgliedsnummer
        type: string
        required: true
        pattern: "M-\\d{5}"
        description: Mitgliedsnummer im Format M-12345
      - {name: zeitraum_von, type: date, required: true, description: Beginn der Pause}
      - {name: zeitraum_bis, type: date, required: true, description: Ende der Pause}
      - name: grund_kategorie
        type: string
        allowed_values: [beruflich, reise, sonstiges]
        description: "Grund nur als Kategorie; keine Freitext-Begründung übernehmen"
    rules:
      - {rule: required_fields}
      - {rule: pause_period, params: {max_months: 6}}
    actions:
      - key: rueckfrage_zeitraum
        label: Rückfrage zum Zeitraum
        when_missing: [zeitraum_von, zeitraum_bis]
        reply_template: |-
          Guten Tag{% if name %} {{ name }}{% endif %},

          gerne pausieren wir Ihre Mitgliedschaft. Bitte teilen Sie uns den genauen Zeitraum
          (Beginn und Ende) mit.

          Mit freundlichen Grüßen
          Ihr FitDemo-Team
      - key: rueckfrage_mitgliedsnummer
        label: Rückfrage zur Mitgliedsnummer
        when_missing: [mitgliedsnummer]
        reply_template: |-
          Guten Tag{% if name %} {{ name }}{% endif %},

          gerne pausieren wir Ihre Mitgliedschaft vom {{ zeitraum_von }} bis {{ zeitraum_bis }}.
          Bitte nennen Sie uns dazu noch Ihre Mitgliedsnummer.

          Mit freundlichen Grüßen
          Ihr FitDemo-Team
      - key: pause_zu_lang
        label: Pause nur verkürzt möglich
        when_rule: {pause_period: [error]}
        reply_template: |-
          Guten Tag{% if name %} {{ name }}{% endif %},

          eine Pause Ihrer Mitgliedschaft {{ mitgliedsnummer }} ist höchstens bis zum {{ max_bis }}
          möglich. Bitte teilen Sie uns mit, ob wir die Pause für diesen Zeitraum einrichten sollen.

          Mit freundlichen Grüßen
          Ihr FitDemo-Team
      - key: pause_bestaetigen
        label: Vertragspause bestätigen
        reply_template: |-
          Guten Tag{% if name %} {{ name }}{% endif %},

          wir bestätigen die Pause Ihrer Mitgliedschaft {{ mitgliedsnummer }} vom
          {{ zeitraum_von }} bis {{ zeitraum_bis }}.

          Mit freundlichen Grüßen
          Ihr FitDemo-Team

  - key: rechnung
    label: Rechnung
    description: Rechnung eines Lieferanten oder Dienstleisters an das Studio (auch E-Rechnung).
    keywords: [rechnung, rechnungsnummer, gesamtbetrag, umsatzsteuer, invoice]
    fields:
      - {name: lieferant, type: string, required: true, description: Name des Rechnungsstellers}
      - {name: rechnungsnummer, type: string, required: true, description: Rechnungsnummer}
      - {name: rechnungsdatum, type: date, required: true, description: Rechnungsdatum}
      - {name: betrag, type: decimal, required: true, description: Gesamtbetrag brutto in EUR}
      - {name: e_rechnung, type: boolean, required: true, description: "true, wenn eine strukturierte E-Rechnung (XRechnung/ZUGFeRD) vorliegt"}
    rules:
      - {rule: required_fields}
      - rule: invoice_totals
        params:
          vat_rates: ["0.19", "0.07"]
          # Beträge werden deterministisch per Muster aus dem Dokumenttext gelesen
          # (benannte Gruppe "amount"); zuerst PDF-Text, dann XRechnung (UBL).
          net_patterns:
            - 'Nettobetrag: (?P<amount>\d+\.\d{2}) EUR'
            - 'TaxExclusiveAmount currencyID="EUR">(?P<amount>\d+\.\d{2})<'
          vat_patterns:
            - 'Umsatzsteuer \d+ %: (?P<amount>\d+\.\d{2}) EUR'
            - 'TaxAmount currencyID="EUR">(?P<amount>\d+\.\d{2})<'
          gross_patterns:
            - 'Gesamtbetrag: (?P<amount>\d+\.\d{2}) EUR'
            - 'PayableAmount currencyID="EUR">(?P<amount>\d+\.\d{2})<'
          position_patterns:
            - '^(?!Nettobetrag|Umsatzsteuer|Gesamtbetrag)[^\n:]+: (?P<amount>\d+\.\d{2}) EUR$'
    actions:
      - key: rueckfrage_lieferant
        label: Rückfrage beim Lieferanten
        when_rule: {required_fields: [error], invoice_totals: [error]}
        reply_template: |-
          Sehr geehrte Damen und Herren,

          zu Ihrer Rechnung{% if rechnungsnummer %} {{ rechnungsnummer }}{% endif %} vom
          {{ rechnungsdatum or "(ohne Datum)" }} haben wir eine Rückfrage: Die Rechnung ist
          unvollständig oder die Beträge sind nicht nachvollziehbar. Bitte senden Sie uns eine
          korrigierte Rechnung.

          Mit freundlichen Grüßen
          FitDemo Studio
      - key: zur_zahlung_vormerken
        label: Zur Zahlung vormerken

  - key: sonstiges
    label: Sonstiges
    description: Alles, was keinem anderen Typ zuzuordnen ist (z. B. Lob, Werbung, allgemeine Fragen).
    fields:
      - {name: kurzbeschreibung, type: string, description: "Kurze sachliche Zusammenfassung in einem Satz"}
    actions:
      - key: zur_kenntnis
        label: Zur Kenntnis nehmen

# Social-Media-Modul (docs/SPEC_social.md, Abschnitt 4.1): was für alle Betriebe der Branche gilt.
social:
  occasion_types:
    - {key: kurs, label: Kurs, required_facts: [datum, uhrzeit, ort]}
    - {key: aktion, label: Aktion, required_facts: [zeitraum, preis]}
    - {key: probetraining, label: Probetraining}
    - {key: veranstaltung, label: Veranstaltung, required_facts: [datum, uhrzeit, ort]}
    - {key: gesundheitstipp, label: Gesundheitstipp}
    - {key: team, label: Team}
    - {key: oeffnungszeiten, label: Öffnungszeiten, required_facts: [zeitraum]}
    - {key: stellenangebot, label: Stellenangebot}
  # Werbung mit Gesundheitsbezug: Warnung, die vor der Freigabe bestätigt werden muss.
  # certain_terms sind eindeutige Heilversprechen: in sensiblen Bereichen ein Fehler.
  health_claims:
    terms:
      - heilt
      - heilen
      - Heilung
      - schmerzfrei
      - lindert
      - Linderung
      - beseitigt
      - kuriert
      - therapiert
      - garantiert
      - Garantie
      - Wundermittel
      - entgiftet
      - Entgiftung
      - Immunsystem
      - beugt
      - vorbeugen
      - verhindert
      - Rückenschmerzen
      - Arthrose
      - Bandscheibenvorfall
      - Bluthochdruck
      - Diabetes
      - Depression
      - Fettverbrennung
      - ohne Nebenwirkungen
      - klinisch bewiesen
      - wissenschaftlich bewiesen
      - ärztlich empfohlen
    certain_terms:
      - heilt
      - Heilung garantiert
      - garantiert schmerzfrei
      - für immer schmerzfrei
      - beseitigt
      - kuriert
      - 100 % wirksam
  term_rules:
    - key: vorher_nachher
      label: Vorher-nachher-Darstellung
      terms: [vorher-nachher, vorher/nachher, vorher und nachher, Vorher-Nachher-Bild]
      outcome: warning
      reason: >-
        Vorher-nachher-Darstellungen sind in der Gesundheitswerbung nur eingeschränkt zulässig
        und brauchen die Einwilligung der gezeigten Personen.
  sensitive_areas: [physio, reha]
  # Kampagnenplan: Beiträge relativ zum Datum des Anlasses (Tage davor).
  campaign_steps:
    - key: ankuendigung
      label: Ankündigung
      offset_days: -21
      instruction: erste Ankündigung, neugierig machen
    - key: erinnerung
      label: Erinnerung
      offset_days: -7
      instruction: Erinnerung, die Anmeldung läuft noch
    - key: letzter_aufruf
      label: Letzter Aufruf
      offset_days: -1
      instruction: letzte Gelegenheit, es geht bald los
