<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_title }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 py-4">
      <h1 class="text-xl font-semibold">{{ app_title }}</h1>
      <p class="text-sm text-slate-500">Demo mit ausschließlich synthetischen Daten</p>
    </div>
    {% set navigation = request.app.state.navigation %}
    {% if navigation | length > 1 %}
    <nav class="max-w-5xl mx-auto px-4 flex gap-1 text-sm" aria-label="Module">
      {% for entry in navigation %}
      <a href="{{ entry.path }}"
         {% if entry.module == active_module %}aria-current="page"{% endif %}
         class="px-3 py-2 border-b-2 {{ 'border-slate-800 font-medium' if entry.module == active_module else 'border-transparent text-slate-500 hover:text-slate-800' }}">
        {{ entry.label }}
      </a>
      {% endfor %}
    </nav>
    {% endif %}
  </header>
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
